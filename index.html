<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetLoad - 1RM Calc & Log</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --highlight: #10b981;
      --highlight-hover: #059669;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    h2 { font-size: 1.05rem; margin-bottom: 8px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    
    /* 入力フォーム */
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    select, input {
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 8px; font-size: 1rem; width: 100%;
    }
    label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    
    /* 単位切り替えスイッチ */
    .unit-switch { display: flex; background: #0f172a; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .unit-btn {
      flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: var(--text-muted); border: none; background: transparent;
    }
    .unit-btn.active { background: var(--accent); color: #fff; }

    /* 重量UPバナー・ボタン */
    .progression-banner {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(16, 185, 129, 0.12); border: 1px solid var(--highlight);
      border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
    }
    .btn-upgrade {
      background: var(--highlight); color: #fff; font-weight: bold; border: none;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.15s;
    }
    .btn-upgrade:hover { background: var(--highlight-hover); }

    /* 推奨重量ボタン */
    .recommend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .target-btn {
      background: #0f172a; border: 1px solid var(--accent); border-radius: 8px;
      padding: 12px 4px; text-align: center; cursor: pointer; transition: 0.15s;
    }
    .target-btn:hover { background: var(--accent); }
    .target-btn .reps-label { font-size: 0.72rem; color: var(--text-muted); }
    .target-btn .weight-val { font-size: 1.2rem; font-weight: bold; color: #fff; margin: 4px 0; }
    .target-btn .action-label { font-size: 0.65rem; color: var(--accent); background: rgba(59, 130, 246, 0.15); padding: 2px 4px; border-radius: 4px; }
    .target-btn:hover .action-label { color: #fff; background: transparent; }

    /* タイマー */
    .timer-card { text-align: center; border: 2px solid var(--border); }
    .timer-card.active { border-color: var(--highlight); }
    .timer-display { font-size: 2.6rem; font-weight: bold; font-variant-numeric: tabular-nums; margin: 4px 0; }
    .timer-controls { display: flex; justify-content: center; gap: 8px; }
    .btn {
      background: var(--border); color: var(--text); border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .btn:hover { opacity: 0.85; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .btn-danger { background: #991b1b; }
    .btn-danger:hover { background: var(--danger); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* 設定アコーディオン */
    .settings-panel { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .settings-panel.open { display: block; }
    .exercise-edit-item { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }

    /* ログ一覧 */
    .log-list { list-style: none; max-height: 180px; overflow-y: auto; font-size: 0.85rem; }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .log-actions { display: flex; gap: 6px; }

    /* 編集モーダル */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); z-index: 100; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 種目選択 ＆ 設定トグル -->
  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
      <h1 style="font-size: 1.1rem;">TargetLoad</h1>
      <button class="btn btn-sm" onclick="toggleSettings()">⚙ 種目編集 / 単位</button>
    </div>

    <!-- 設定展開エリア -->
    <div class="settings-panel" id="settingsPanel">
      <div class="row">
        <div style="flex: 1;">
          <label>表示単位</label>
          <div class="unit-switch">
            <button class="unit-btn active" id="btnKg" onclick="setUnit('kg')">kg</button>
            <button class="unit-btn" id="btnLb" onclick="setUnit('lb')">lb</button>
          </div>
        </div>
        <div style="flex: 1;">
          <label>器具刻み幅 (<span class="unit-text">kg</span>)</label>
          <input type="number" id="weightIncrement" value="2.5" step="0.5" onchange="saveCurrentExerciseConfig(); calculateProjections();">
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label>種目名の変更（全10枠）</label>
        <div id="exerciseEditList"></div>
      </div>
    </div>

    <!-- 種目選択ドロップダウン -->
    <div style="margin-top: 6px;">
      <label>トレーニング種目</label>
      <select id="exerciseSelect" onchange="onExerciseChange()"></select>
    </div>

    <!-- 実績入力部 -->
    <div class="row" style="margin-top: 8px;">
      <div style="flex: 1;">
        <label>前回重量 (<span class="unit-text">kg</span>)</label>
        <input type="number" id="prevWeight" value="30.0" step="0.5" oninput="calculateProjections()">
      </div>
      <div style="flex: 1;">
        <label>前回回数 (reps)</label>
        <input type="number" id="prevReps" value="8" min="1" max="30" oninput="calculateProjections()">
      </div>
    </div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;" id="estimated1RMText">推定1RM: --</p>
  </div>

  <!-- 次回目標 ＆ 重量UPセクション -->
  <div class="card">
    <h2>次回目標 (タップで記録＆タイマー始動)</h2>

    <!-- 目標達成時の重量アップボタン -->
    <div class="progression-banner" id="upgradeBanner">
      <div>
        <div style="font-size:0.85rem; font-weight:bold; color:var(--highlight);" id="upgradeMsg">規定回数クリア！</div>
        <div style="font-size:0.75rem; color:var(--text-muted);" id="upgradeDetail">+2.5kg で次のステップへ</div>
      </div>
      <button class="btn-upgrade" onclick="applyWeightProgression()">🔥 重量UP適用</button>
    </div>

    <div class="recommend-grid">
      <div class="target-btn" onclick="applyAndLog(5, rec5)">
        <div class="reps-label">筋力重視 (5回)</div>
        <div class="weight-val" id="val5">--</div>
        <span class="action-label">3分休憩</span>
      </div>
      <div class="target-btn" onclick="applyAndLog(10, rec10)">
        <div class="reps-label">筋肥大 (10回)</div>
        <div class="weight-val" id="val10">--</div>
        <span class="action-label">2分休憩</span>
      </div>
      <div class="target-btn" onclick="applyAndLog(15, rec15)">
        <div class="reps-label">筋持久力 (15回)</div>
        <div class="weight-val" id="val15">--</div>
        <span class="action-label">90秒休憩</span>
      </div>
    </div>
  </div>

  <!-- インターバルタイマー -->
  <div class="card timer-card" id="timerCard">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
      <span style="font-size: 0.8rem; color: var(--text-muted);">REST INTERVAL</span>
      <button class="btn btn-sm" onclick="playAlarmSound()" title="音量確認用">🔔 音テスト</button>
    </div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-controls">
      <button class="btn" onclick="addTimerSeconds(30)">+30秒</button>
      <button class="btn" onclick="stopTimer()">スキップ</button>
    </div>
  </div>

  <!-- 成長推移グラフ -->
  <div class="card">
    <h2>推定1RM推移 (<span class="unit-text">kg</span>)</h2>
    <canvas id="rmChart" style="max-height: 180px;"></canvas>
  </div>

  <!-- 履歴 ＆ 編集エリア -->
  <div class="card">
    <h2>この種目の履歴 (編集可能)</h2>
    <ul class="log-list" id="logList"></ul>
  </div>

</div>

<!-- データ編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 style="font-size: 1rem; margin-bottom: 12px;">記録の修正</h3>
    <input type="hidden" id="editLogId">
    <div style="margin-bottom: 8px;">
      <label>日時</label>
      <input type="text" id="editLogDate">
    </div>
    <div class="row">
      <div style="flex: 1;">
        <label>重量 (<span class="unit-text">kg</span>)</label>
        <input type="number" id="editLogWeight" step="0.5">
      </div>
      <div style="flex: 1;">
        <label>回数 (reps)</label>
        <input type="number" id="editLogReps" min="1" max="50">
      </div>
    </div>
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;">
      <button class="btn" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEditedLog()">保存する</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_EXERCISES = [
    { id: 1, name: "ダンベルプレス", stepKg: 2.5, stepLb: 5.0 },
    { id: 2, name: "インクラインDBプレス", stepKg: 2.5, stepLb: 5.0 },
    { id: 3, name: "ワンハンドローイング", stepKg: 2.5, stepLb: 5.0 },
    { id: 4, name: "サイドレイズ", stepKg: 1.0, stepLb: 2.5 },
    { id: 5, name: "アームカール", stepKg: 1.0, stepLb: 2.5 },
    { id: 6, name: "フレンチプレス", stepKg: 1.0, stepLb: 2.5 },
    { id: 7, name: "ブルガリアンスクワット", stepKg: 2.5, stepLb: 5.0 },
    { id: 8, name: "ルーマニアンデッドリフト", stepKg: 2.5, stepLb: 5.0 },
    { id: 9, name: "スタンディングカーフ", stepKg: 2.5, stepLb: 5.0 },
    { id: 10, name: "種目10（未設定）", stepKg: 2.5, stepLb: 5.0 }
  ];

  let exercises = [];
  let currentUnit = 'kg';
  let rec5 = 0, rec10 = 0, rec15 = 0;
  let timerInterval = null;
  let remainingSec = 0;
  let chart = null;

  // Web Audio API
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playAlarmSound() {
    initAudio();
    if (!audioCtx) return;

    const beeps = [
      { time: 0.0, dur: 0.12, freq: 880 },
      { time: 0.18, dur: 0.12, freq: 880 },
      { time: 0.36, dur: 0.35, freq: 1174.66 }
    ];

    const now = audioCtx.currentTime;
    beeps.forEach(b => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(b.freq, now + b.time);
      gain.gain.setValueAtTime(0.3, now + b.time);
      gain.gain.exponentialRampToValueAtTime(0.001, now + b.time + b.dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + b.time);
      osc.stop(now + b.time + b.dur);
    });
  }

  // --- 初期化 ---
  function init() {
    exercises = JSON.parse(localStorage.getItem('user_exercises')) || DEFAULT_EXERCISES;
    currentUnit = localStorage.getItem('user_unit') || 'kg';

    ensureLogIds();
    updateUnitUI();
    renderExerciseSelect();
    renderExerciseEditor();
    onExerciseChange();

    document.body.addEventListener('touchstart', initAudio, { once: true });
    document.body.addEventListener('click', initAudio, { once: true });
  }

  function ensureLogIds() {
    const logs = getLogs();
    let updated = false;
    logs.forEach(l => {
      if (!l.id) {
        l.id = 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        updated = true;
      }
    });
    if (updated) localStorage.setItem('workout_logs', JSON.stringify(logs));
  }

  // --- 単位切り替え ---
  function setUnit(unit) {
    currentUnit = unit;
    localStorage.setItem('user_unit', unit);
    updateUnitUI();
    
    const currentEx = getCurrentExercise();
    document.getElementById('weightIncrement').value = (currentUnit === 'kg') ? currentEx.stepKg : currentEx.stepLb;
    
    syncLatestInputs();
    calculateProjections();
    renderLogsAndChart();
  }

  function updateUnitUI() {
    document.querySelectorAll('.unit-text').forEach(el => el.innerText = currentUnit);
    document.getElementById('btnKg').className = `unit-btn ${currentUnit === 'kg' ? 'active' : ''}`;
    document.getElementById('btnLb').className = `unit-btn ${currentUnit === 'lb' ? 'active' : ''}`;
  }

  // --- 種目管理 ---
  function renderExerciseSelect() {
    const select = document.getElementById('exerciseSelect');
    const selectedId = select.value || exercises[0].id;
    select.innerHTML = '';
    exercises.forEach(ex => {
      const opt = document.createElement('option');
      opt.value = ex.id;
      opt.innerText = ex.name;
      select.appendChild(opt);
    });
    select.value = selectedId;
  }

  function renderExerciseEditor() {
    const container = document.getElementById('exerciseEditList');
    container.innerHTML = '';
    exercises.forEach(ex => {
      const row = document.createElement('div');
      row.className = 'exercise-edit-item';
      row.innerHTML = `
        <span style="font-size:0.8rem; width:22px; color:var(--text-muted);">${ex.id}.</span>
        <input type="text" value="${ex.name}" onchange="updateExerciseName(${ex.id}, this.value)">
      `;
      container.appendChild(row);
    });
  }

  function updateExerciseName(id, newName) {
    const ex = exercises.find(e => e.id === id);
    if (ex) {
      ex.name = newName.trim() || `種目 ${id}`;
      saveExercises();
      renderExerciseSelect();
    }
  }

  function saveExercises() {
    localStorage.setItem('user_exercises', JSON.stringify(exercises));
  }

  function getCurrentExercise() {
    const id = parseInt(document.getElementById('exerciseSelect').value) || 1;
    return exercises.find(e => e.id === id) || exercises[0];
  }

  function syncLatestInputs() {
    const ex = getCurrentExercise();
    const logs = getLogs().filter(l => l.exerciseId === ex.id && l.unit === currentUnit);
    if (logs.length > 0) {
      const latest = logs[logs.length - 1];
      document.getElementById('prevWeight').value = latest.weight;
      document.getElementById('prevReps').value = latest.reps;
    } else {
      document.getElementById('prevWeight').value = (currentUnit === 'kg') ? 30.0 : 65.0;
      document.getElementById('prevReps').value = 8;
    }
  }

  function onExerciseChange() {
    const ex = getCurrentExercise();
    document.getElementById('weightIncrement').value = (currentUnit === 'kg') ? ex.stepKg : ex.stepLb;

    syncLatestInputs();
    calculateProjections();
    renderLogsAndChart();
  }

  function saveCurrentExerciseConfig() {
    const ex = getCurrentExercise();
    const val = parseFloat(document.getElementById('weightIncrement').value) || 1.0;
    if (currentUnit === 'kg') ex.stepKg = val;
    else ex.stepLb = val;
    saveExercises();
  }

  function toggleSettings() {
    const p = document.getElementById('settingsPanel');
    p.classList.toggle('open');
  }

  // --- 計算ロジック ---
  function calc1RM(weight, reps) {
    return reps === 1 ? weight : weight * (1 + reps / 30);
  }

  function calcWeightFrom1RM(oneRM, targetReps) {
    return oneRM / (1 + targetReps / 30);
  }

  function roundToStep(weight, step) {
    return (Math.round(weight / step) * step);
  }

  function calculateProjections() {
    const w = parseFloat(document.getElementById('prevWeight').value) || 0;
    const r = parseInt(document.getElementById('prevReps').value) || 0;
    const step = parseFloat(document.getElementById('weightIncrement').value) || 1.0;

    // 重量UPバナーの更新
    const banner = document.getElementById('upgradeBanner');
    const upgradeMsg = document.getElementById('upgradeMsg');
    const upgradeDetail = document.getElementById('upgradeDetail');
    const nextWeight = (w + step).toFixed(1);

    if (r >= 10) {
      upgradeMsg.innerText = `規定回数達成！（前回: ${r}回）`;
      upgradeDetail.innerText = `+${step}${currentUnit} 増量（${w} ➔ ${nextWeight}${currentUnit}）して挑戦`;
      banner.style.borderColor = "var(--highlight)";
      banner.style.background = "rgba(16, 185, 129, 0.12)";
    } else {
      upgradeMsg.innerText = `オーバーロード（重量UP）`;
      upgradeDetail.innerText = `+${step}${currentUnit} 増量（${w} ➔ ${nextWeight}${currentUnit}）`;
      banner.style.borderColor = "var(--border)";
      banner.style.background = "rgba(15, 23, 42, 0.6)";
    }

    if (w <= 0 || r <= 0) return;

    const oneRM = calc1RM(w, r);
    document.getElementById('estimated1RMText').innerText = `推定1RM: ${oneRM.toFixed(1)} ${currentUnit}`;

    rec5 = roundToStep(calcWeightFrom1RM(oneRM, 5), step);
    rec10 = roundToStep(calcWeightFrom1RM(oneRM, 10), step);
    rec15 = roundToStep(calcWeightFrom1RM(oneRM, 15), step);

    const fmt = n => parseFloat(n.toFixed(2));
    document.getElementById('val5').innerText = `${fmt(rec5)}${currentUnit}`;
    document.getElementById('val10').innerText = `${fmt(rec10)}${currentUnit}`;
    document.getElementById('val15').innerText = `${fmt(rec15)}${currentUnit}`;
  }

  // --- 重量UPボタン処理 ---
  function applyWeightProgression() {
    const currentW = parseFloat(document.getElementById('prevWeight').value) || 0;
    const step = parseFloat(document.getElementById('weightIncrement').value) || 1.0;
    const newWeight = parseFloat((currentW + step).toFixed(2));

    document.getElementById('prevWeight').value = newWeight;
    // 重量アップ直後は標準的な反復数（例: 8回）として再試算
    document.getElementById('prevReps').value = 8;
    calculateProjections();
  }

  // --- 記録 & タイマー連動 ---
  function applyAndLog(reps, weight) {
    initAudio();
    const ex = getCurrentExercise();
    const oneRM = parseFloat(calc1RM(weight, reps).toFixed(1));
    const now = new Date();
    const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

    const newRecord = {
      id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
      date: dateStr,
      exerciseId: ex.id,
      weight: parseFloat(weight.toFixed(2)),
      reps: reps,
      unit: currentUnit,
      oneRM: oneRM
    };

    saveLog(newRecord);
    syncLatestInputs();
    calculateProjections();
    renderLogsAndChart();

    let restSec = 120;
    if (reps <= 5) restSec = 180;
    else if (reps >= 15) restSec = 90;

    startTimer(restSec);
  }

  // --- タイマー ---
  function startTimer(seconds) {
    clearInterval(timerInterval);
    remainingSec = seconds;
    const card = document.getElementById('timerCard');
    card.classList.add('active');
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      remainingSec--;
      updateTimerDisplay();
      if (remainingSec <= 0) {
        clearInterval(timerInterval);
        card.classList.remove('active');
        playAlarmSound();
        if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]);
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(remainingSec / 60);
    const secs = remainingSec % 60;
    document.getElementById('timerDisplay').innerText = 
      `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function addTimerSeconds(sec) {
    remainingSec += sec;
    updateTimerDisplay();
  }

  function stopTimer() {
    clearInterval(timerInterval);
    remainingSec = 0;
    updateTimerDisplay();
    document.getElementById('timerCard').classList.remove('active');
  }

  // --- ストレージ操作 ---
  function getLogs() {
    return JSON.parse(localStorage.getItem('workout_logs') || '[]');
  }

  function saveLog(record) {
    const logs = getLogs();
    logs.push(record);
    localStorage.setItem('workout_logs', JSON.stringify(logs));
  }

  // --- ログの編集・削除機能 ---
  function openEditModal(logId) {
    const logs = getLogs();
    const log = logs.find(l => l.id === logId);
    if (!log) return;

    document.getElementById('editLogId').value = log.id;
    document.getElementById('editLogDate').value = log.date;
    document.getElementById('editLogWeight').value = log.weight;
    document.getElementById('editLogReps').value = log.reps;

    document.getElementById('editModal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  function saveEditedLog() {
    const id = document.getElementById('editLogId').value;
    const date = document.getElementById('editLogDate').value;
    const weight = parseFloat(document.getElementById('editLogWeight').value) || 0;
    const reps = parseInt(document.getElementById('editLogReps').value) || 0;

    if (weight <= 0 || reps <= 0) {
      alert("有効な重量と回数を入力してください");
      return;
    }

    const logs = getLogs();
    const logIndex = logs.findIndex(l => l.id === id);
    if (logIndex !== -1) {
      logs[logIndex].date = date;
      logs[logIndex].weight = weight;
      logs[logIndex].reps = reps;
      logs[logIndex].oneRM = parseFloat(calc1RM(weight, reps).toFixed(1));
      
      localStorage.setItem('workout_logs', JSON.stringify(logs));
      closeEditModal();
      
      syncLatestInputs();
      calculateProjections();
      renderLogsAndChart();
    }
  }

  function deleteLog(logId) {
    if (!confirm("このログを削除しますか？")) return;
    let logs = getLogs();
    logs = logs.filter(l => l.id !== logId);
    localStorage.setItem('workout_logs', JSON.stringify(logs));
    
    syncLatestInputs();
    calculateProjections();
    renderLogsAndChart();
  }

  // --- レンダリング ---
  function renderLogsAndChart() {
    const ex = getCurrentExercise();
    const logs = getLogs().filter(l => l.exerciseId === ex.id && l.unit === currentUnit);
    
    const listEl = document.getElementById('logList');
    listEl.innerHTML = '';
    logs.slice().reverse().forEach(log => {
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `
        <div>
          <span style="font-size:0.75rem; color:var(--text-muted); display:block;">${log.date}</span>
          <span><strong>${log.weight}${log.unit}</strong> × ${log.reps}回</span>
          <span style="color:var(--accent); font-size:0.8rem; margin-left:4px;">(1RM: ${log.oneRM})</span>
        </div>
        <div class="log-actions">
          <button class="btn btn-sm" onclick="openEditModal('${log.id}')">✏️ 編集</button>
          <button class="btn btn-sm btn-danger" onclick="deleteLog('${log.id}')">🗑</button>
        </div>
      `;
      listEl.appendChild(li);
    });

    const labels = logs.map(l => l.date);
    const data1RM = logs.map(l => l.oneRM);

    if (chart) chart.destroy();
    const ctx = document.getElementById('rmChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: `推定1RM (${currentUnit})`,
          data: data1RM,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.2,
          fill: true
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });
  }

  window.onload = init;
</script>

</body>
</html>
